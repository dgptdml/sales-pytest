name: Pytest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 写假 config.py（用 echo 最稳，避免 Python heredoc 缩进问题）
      - name: Setup fake config
        run: |
          echo "import os" > config.py
          echo "BASE_DIR = os.path.dirname(__file__)" >> config.py
          echo "BASE_URL = 'http://localhost:8080'" >> config.py
          echo "USERNAME = 'admin'" >> config.py
          echo "PASSWORD = '123456'" >> config.py
          echo "NAME = 'test'" >> config.py
          echo "SUBJECT = '6'" >> config.py
          echo "PRICE = 899" >> config.py
          echo "APPLICABLE_PERSON = '2'" >> config.py
          echo "INFO = 'test'" >> config.py

      # 语法编译检查（最稳，不触发 import 链）
      - name: Python compile check
        run: python -m compileall -q api/ common/ scripts/

      # pytest collect（确保能被 pytest 识别）
      - name: Pytest collect-only
        run: pytest --collect-only -q
