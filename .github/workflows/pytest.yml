name: Pytest CI

# push / pull_request 时自动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 拉代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 装 Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 用 Python 写一个假的 config.py（避免 sed 引号转义问题）
      - name: Setup fake config
        run: |
          python -c "
          with open('config.py', 'w') as f:
              f.write(\"\"\"import os
          BASE_DIR = os.path.dirname(__file__)
          BASE_URL = 'http://localhost:8080'
          USERNAME = 'admin'
          PASSWORD = '123456'
          NAME = 'test'
          SUBJECT = '6'
          PRICE = 899
          APPLICABLE_PERSON = '2'
          INFO = 'test'
          \"\"\")
          "

      # 5. 语法检查（collect-only 确保代码能被正确收集，不跑真实接口）
      - name: Check pytest collect
        run: pytest --collect-only -q
