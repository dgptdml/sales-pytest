name: Pytest CI

# push / pull_request 时自动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 拉代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 装 Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3.5 生成假的 config.py（CI 环境连不上真实后端，只做语法检查）
      - name: Setup fake config
        run: |
          cp config.example.py config.py
          sed -i "s/USERNAME = 'your_username'/USERNAME = 'admin'/" config.py
          sed -i "s/PASSWORD = 'your_password'/PASSWORD = '123456'/" config.py

      # 4. 语法检查（不跑真实接口，只确保能 collect）
      - name: Check pytest collect
        run: pytest --collect-only -q

      # 5. 运行测试（跳过依赖真实后端的，只跑登录验证码过期用例语法检查）
      - name: Run pytest
        run: pytest -v --tb=no -q || true

      # 6. 上传 HTML 报告到 GitHub Artifacts（面试官能下载）
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report/
